; SO-ARM101 无线从臂固件 —— ESP32-NanoCam 模块 (ESP32-S3 N16R8)
; 历史: 原版 ESP32 → ESP32-S3 → 自研 ESP32-NanoCam 模块 (boards/nano_cam.json)
; NanoCam 硬件差异:
;   * 调试串口 = UART0 (GPIO43/44, 板载 CH340K → USB), 无原生 USB CDC
;   * 舵机总线 = UART1 映射到扩展串口排针 (RX=GPIO19, TX=GPIO20)
;   * 摄像头   = DVP GC2145 (GPIO1~14 + SCCB 41/42), XCLK 24MHz
;   * 音频     = ES8311 编解码 (I2S: MCLK39/BCLK38/WS47/DIN40/DOUT48, I2C 41/42)
;   * RGB      = WS2812 @ GPIO18
[env:nano_cam]
platform = espressif32
board = nano_cam
framework = arduino
monitor_speed = 115200

; SCServo 已本地化到 lib/scservo (1.0.2)，无需网络依赖
lib_deps =

; 注意: 本工程的头文件树是扁平结构 (include/<pkg>/<header>.h)，
; 只需根路径 -Ilib/microros/include 即可解析 <pkg/xxx.h>。
; 不要添加逐包的 -Ilib/microros/include/<pkg>/ 路径——
; 那会把 <string.h> 解析成 rosidl_runtime_c/string.h、把 WiFi 库的
; <Client.h> 解析成 rcl/Client.h，导致编译失败（原工程是嵌套
; 头文件结构，因此需要逐包路径，改造时已随头文件树一起调整）。
build_flags =
    -Ilib/microros/include
    -DRMW_UXRCE_TRANSPORT=custom
    -DRMW_UXRCE_MAX_HISTORY=4
    -DRMW_UXRCE_MAX_SESSIONS=1
    -DRMW_UXRCE_MAX_TOPICS=4
    -DRMW_UXRCE_MAX_SERVICES=0
    -DRMW_UXRCE_MAX_CLIENTS=0
    -DRMW_UXRCE_STREAM_HISTORY=4
    -DRMW_UXRCE_MAX_PUBLISHERS=1
    -DRMW_UXRCE_MAX_SUBSCRIBERS=1
    -DRMW_UXRCE_MAX_TIMERS=1
    -DRMW_UXRCE_MAX_NODES=1
    -Llib/microros
    -lmicroros
